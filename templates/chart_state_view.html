<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>State — Step {{ step_id }}</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 900px;
      height: 500px;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px 10px;
      border-bottom: 2px solid #e8e8e8;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.02em;
    }

    .header-meta {
      font-size: 13px;
      color: #888;
    }

    .header-meta span {
      margin-left: 18px;
    }

    /* ── Chart area ─────────────────────────────────────────────── */
    .chart-area {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 28px 48px 0;
      gap: 0;
    }

    /* ── Each bar column ────────────────────────────────────────── */
    .bar-col {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      max-width: 140px;
      height: 100%;
      padding: 0 10px;
    }

    .bar-value {
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      letter-spacing: 0.01em;
    }

    .bar-body {
      width: 100%;
      min-height: 4px;
      border-radius: 4px 4px 0 0;
      transition: height 0.2s ease;
    }

    /* default input variable colour */
    .bar-body.input {
      background: #4a90d9;
    }

    /* target variable colour */
    .bar-body.target {
      background: #e07b2a;
    }

    /* ── X-axis label row ───────────────────────────────────────── */
    .axis-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-shrink: 0;
      gap: 0;
      margin-top: 0;
      padding: 0 48px;
      border-top: 2px solid #cccccc;
    }

    .axis-label {
      flex: 1;
      max-width: 140px;
      padding: 7px 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      text-align: center;
    }

    .axis-label.target {
      color: #e07b2a;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      display: flex;
      flex-shrink: 0;
      justify-content: flex-end;
      gap: 20px;
      padding: 8px 28px 12px;
      font-size: 11px;
      color: #bbb;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 2px;
    }

    .legend-swatch.input {
      background: #4a90d9;
    }

    .legend-swatch.target {
      background: #e07b2a;
    }
  </style>
</head>
<body>
  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-title">Current State</div>
    <div class="header-meta">
      <span>Step <strong>{{ step_id if step_id is not none else "—" }}</strong></span>
      <span>Target: <strong>{{ target_display }}</strong></span>
    </div>
  </div>

  <!-- ── Chart ──────────────────────────────────────────────────── -->
  <!--
    bars is a list of dicts:
      { name: str, value: float, norm_height: float (0–1), is_target: bool }
    The chart area is 100% height; each bar's pixel height is
    norm_height * chart-area-height, achieved via a flex trick below.
  -->
  <div class="chart-area">
    {% for bar in bars %}
      <div class="bar-col">
        <div class="bar-value">{{ "%.3g" | format(bar.value) }}</div>
        <div
          class="bar-body {{ 'target' if bar.is_target else 'input' }}"
          style="height: {{ [bar.norm_height * 100, 1] | max }}%;"
        ></div>
      </div>
    {% endfor %}
  </div>

  <!-- ── X-axis labels ──────────────────────────────────────────── -->
  <div class="axis-row">
    {% for bar in bars %}
      <div class="axis-label {{ 'target' if bar.is_target else '' }}">
        {{ bar.name }}
      </div>
    {% endfor %}
  </div>

  <!-- ── Footer / legend ────────────────────────────────────────── -->
  <div class="footer">
    <div class="legend-item">
      <div class="legend-swatch input"></div>
      <span>input variable</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch target"></div>
      <span>target ({{ target_display }})</span>
    </div>
  </div>
</body>
</html>
