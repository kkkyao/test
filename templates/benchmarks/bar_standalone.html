<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bar Chart — Step {{ step_id + 1 }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 8px;
      border-bottom: 2px solid #e8e8e8;
      flex: 0 0 auto;
    }
    .header-title { font-size: 22px; font-weight: 700; color: #1a1a1a; }
    .header-meta  { font-size: 12px; color: #888; }

    .panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-label {
      flex: 0 0 26px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #f5f7fa;
      color: #4a90d9;
      border-bottom: 1px solid #dce8f5;
    }

    .chart-area {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px 48px 0;
      position: relative;
    }

    /* Y-axis grid lines */
    .y-grid {
      position: absolute;
      left: 48px;
      right: 48px;
      border-top: 1px dashed #e0e0e0;
      display: flex;
      align-items: flex-end;
      pointer-events: none;
    }
    .y-tick-label {
      position: absolute;
      left: 20px;
      font-size: 10px;
      color: #aaa;
      transform: translateY(50%);
    }

    .bar-col {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      max-width: 160px;
      height: 100%;
      padding: 0 12px;
    }

    .bar-value {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }

    .bar-body {
      width: 100%;
      min-height: 4px;
      border-radius: 4px 4px 0 0;
      background: #4a90d9;
    }

    .axis-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex: 0 0 38px;
      padding: 0 48px;
      border-top: 2px solid #bbb;
    }

    .axis-label {
      flex: 1;
      max-width: 160px;
      padding: 6px 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      text-align: center;
    }

    .page-footer {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      padding: 5px 28px 8px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #bbb;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-swatch { width: 11px; height: 11px; border-radius: 2px; background: #4a90d9; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="header-title">Step {{ step_id + 1 }}</div>
  <div class="header-meta">Variables: a, b, c</div>
</div>

<div class="panel">
  <div class="panel-label">Controls — shared scale 1–10</div>

  <div class="chart-area">
    {% for bar in bars %}
    <div class="bar-col">
      {% if show_values %}
      <div class="bar-value">{{ "%.3g" | format(bar.value) }}</div>
      {% else %}
      <div class="bar-value" style="visibility:hidden;">0</div>
      {% endif %}
      <div class="bar-body" style="height: {{ [bar.norm_height * 100, 1] | max }}%;"></div>
    </div>
    {% endfor %}
  </div>

  <div class="axis-row">
    {% for bar in bars %}
    <div class="axis-label">{{ bar.name }}</div>
    {% endfor %}
  </div>
</div>

<div class="page-footer">
  <div class="legend-item">
    <div class="legend-swatch"></div>
    <span>input variable (scale 1–10)</span>
  </div>
</div>

</body>
</html>
