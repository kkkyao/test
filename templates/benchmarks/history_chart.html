<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ plot_type | capitalize }} Chart — Step {{ current_step_id }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: {{ width }}px;
      height: {{ height }}px;
      background: #ffffff;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      overflow: hidden;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 8px;
      border-bottom: 2px solid #e8e8e8;
    }
    .header-title { font-size: 14px; font-weight: 600; color: #333; }
    .header-meta  { font-size: 12px; color: #888; }

    svg { display: block; }

    .axis       { stroke: #374151; stroke-width: 1.5; }
    .grid-line  { stroke: #e5e7eb; stroke-width: 1; }
    .tick-label { font-size: 11px; fill: #6b7280; }
    .axis-label { font-size: 12px; fill: #374151; font-weight: 600; }
    .point-label {
      font-size: 11px; font-weight: 700;
      paint-order: stroke; stroke: #ffffff;
      stroke-width: 3px; stroke-linejoin: round;
    }
    .legend-label { font-size: 13px; fill: #1a1a1a; }
    .legend-label-current { font-weight: 700; }
  </style>
</head>
<body>

<div class="page-header">
  <div class="header-title">
    {{ plot_type | capitalize }} Chart — History up to Step {{ current_step_id }}
  </div>
  <div class="header-meta">{{ n_vars }} variables shown</div>
</div>

<svg width="{{ width }}" height="{{ height - header_height }}">

  <!-- Horizontal grid lines + y-axis tick labels -->
  {% for tick in y_ticks %}
  <line
    class="grid-line"
    x1="{{ plot_x }}"  y1="{{ tick.y }}"
    x2="{{ plot_x + plot_w }}" y2="{{ tick.y }}"
  />
  <text class="tick-label" x="{{ plot_x - 8 }}" y="{{ tick.y + 4 }}" text-anchor="end">
    {{ tick.label }}
  </text>
  {% endfor %}

  <!-- Y axis -->
  <line class="axis"
    x1="{{ plot_x }}" y1="{{ plot_y }}"
    x2="{{ plot_x }}" y2="{{ plot_y + plot_h }}"
  />

  <!-- X axis -->
  <line class="axis"
    x1="{{ plot_x }}"          y1="{{ plot_y + plot_h }}"
    x2="{{ plot_x + plot_w }}" y2="{{ plot_y + plot_h }}"
  />

  <!-- X-axis tick marks + step labels -->
  {% for tick in x_ticks %}
  <line class="axis"
    x1="{{ tick.x }}" y1="{{ plot_y + plot_h }}"
    x2="{{ tick.x }}" y2="{{ plot_y + plot_h + 5 }}"
  />
  <text class="tick-label" x="{{ tick.x }}" y="{{ plot_y + plot_h + 18 }}" text-anchor="middle">
    {{ tick.label }}
  </text>
  {% endfor %}

  <!-- Axis labels -->
  <text class="axis-label"
    x="{{ plot_x + plot_w / 2 }}"
    y="{{ plot_y + plot_h + 38 }}"
    text-anchor="middle">Step</text>

  <text class="axis-label"
    transform="translate(16 {{ plot_y + plot_h / 2 }}) rotate(-90)"
    text-anchor="middle">Value (1–10)</text>

  <!-- Series: lines (line chart only) -->
  {% if plot_type == "line" %}
  {% for s in series %}
  {% if s.path %}
  <path
    d="{{ s.path }}"
    fill="none"
    stroke="{{ s.color }}"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  {% endif %}
  {% endfor %}
  {% endif %}

  <!-- Series: points + optional value labels -->
  {% for s in series %}
  {% for p in s.points %}
  <circle
    cx="{{ p.x }}" cy="{{ p.y }}"
    r="{% if p.is_current %}7{% else %}5{% endif %}"
    fill="{{ s.color }}"
    stroke="#ffffff"
    stroke-width="1.5"
  />
  {% if show_values %}
  <text class="point-label"
    x="{{ p.x + 9 }}" y="{{ p.y - 8 }}"
    fill="{{ s.color }}">{{ p.value_label }}</text>
  {% endif %}
  {% endfor %}
  {% endfor %}

  <!-- Legend (top-right) -->
  {% for s in series %}
  {% set lx = plot_x + plot_w - 30 %}
  {% set ly = plot_y + 14 + loop.index0 * 22 %}
  <circle cx="{{ lx }}" cy="{{ ly }}" r="6" fill="{{ s.color }}" />
  <text class="legend-label" x="{{ lx - 10 }}" y="{{ ly + 5 }}" text-anchor="end">
    {{ s.name }}
  </text>
  {% endfor %}

</svg>

</body>
</html>
