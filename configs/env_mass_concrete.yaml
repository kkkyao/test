environment:
  target_variable: mass

  variables:
    density:
      manipulable: true
      initial_value: 2
      step_size: 1
      min_value: 1
      max_value: 10
      description: density of the material in kg per cubic metre

    volume:
      manipulable: true
      initial_value: 10
      step_size: 5
      min_value: 5
      max_value: 50
      description: volume of the object in cubic metres

    mass:
      manipulable: false
      description: total mass of the object in kilograms

  equations:
    mass: "density * volume"

representation:
  naming_mode: concrete
  metadata_level: rich
  name_mapping:
    density: density
    volume: volume
    mass: mass

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    density: density
    volume: volume
    mass: mass
  equation_variables:
    - density
    - volume

noise:
  enabled: false
  type: null
  params: {}