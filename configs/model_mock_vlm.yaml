agent:
  backend: mock_vlm
  loop: false
  mock_action_sequence:
    - step_type: action
      action_type: set
      variable: A
      value: 3.0
      reasoning: "Set A to 3 to observe effect on Y."
    - step_type: action
      action_type: set
      variable: B
      value: 2.0
      reasoning: "Set B to 2 to observe joint effect."
    - step_type: action
      action_type: set
      variable: C
      value: 1.0
      reasoning: "Set C to 1 to isolate variables."
    - step_type: action
      action_type: set
      variable: A
      value: 6.0
      reasoning: "Double A to check proportionality."
    - step_type: finish
      final_equation: "Y = A * B * C"
      reasoning: "Y appears proportional to A, B, and C."