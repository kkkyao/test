agent:
  backend: mock_vlm
  loop: false
  mock_action_sequence:
    - step_type: action
      action_type: increase
      variable: A
      reasoning: "Increase A to observe effect on Y."
    - step_type: action
      action_type: increase
      variable: B
      reasoning: "Increase B to observe joint effect."
    - step_type: action
      action_type: increase
      variable: C
      reasoning: "Increase C to isolate variables."
    - step_type: action
      action_type: increase
      variable: A
      reasoning: "Increase A again to check proportionality."
    - step_type: finish
      final_equation: "Y = A * B * C"
      reasoning: "Y appears proportional to A, B, and C."