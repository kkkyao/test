environment:
  target_variable: absorbance

  variables:
    molar_absorptivity:
      manipulable: true
      initial_value: 1
      step_size: 1
      min_value: 1
      max_value: 10
      description: molar absorptivity coefficient of the solute

    concentration:
      manipulable: true
      initial_value: 2
      step_size: 1
      min_value: 1
      max_value: 10
      description: amount of solute per volume

    path_length:
      manipulable: true
      initial_value: 1
      step_size: 1
      min_value: 1
      max_value: 10
      description: distance the light travels through the solution

    transmittance:
      manipulable: false
      description: fraction of light transmitted through the solution

    absorbance:
      manipulable: false
      description: amount of light absorbed by the solution

  equations:
    absorbance: "molar_absorptivity * concentration * path_length"
    transmittance: "10 ** (-absorbance)"

representation:
  naming_mode: abstract
  metadata_level: none
  name_mapping:
    molar_absorptivity: A
    concentration: B
    path_length: C
    transmittance: T
    absorbance: Y

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    A: molar_absorptivity
    B: concentration
    C: path_length
    T: transmittance
    Y: absorbance
  equation_variables:
    - A
    - B
    - C

noise:
  enabled: false
  type: null
  params: {}