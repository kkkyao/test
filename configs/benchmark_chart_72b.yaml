benchmark:
  name: chart_sanity_72b
  seed: 42
  n_sequences: 5
  sequence_length: 5   # steps 0 – 4
  round_digits: 0

  variables:
    input_variables:
      - a
      - b
      - c

    specs:
      a:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0
      b:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0
      c:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0

  # 6 modalities: current-state family (bar, slider, grid) × OCR/no-OCR
  # Skips line/scatter (history-aware) for this light sanity check.
  modalities:
    - bar_ocr
    - bar_nocr
    - slider_ocr
    - slider_nocr
    - grid_ocr
    - grid_nocr

  tasks:

    # ── Value Extraction ─────────────────────────────────────────────
    - id: read_a_last
      type: value_at_step
      variable: a
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of a?"

    - id: read_b_last
      type: value_at_step
      variable: b
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of b?"

    - id: read_c_last
      type: value_at_step
      variable: c
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of c?"

    # ── Changed Variable Detection ───────────────────────────────────
    - id: changed_step3_4
      type: changed_variable
      from_step: 3
      to_step: 4
      answer_type: category
      question: "Which variable changed from step {from_step} to step {to_step}? Answer with exactly one of: a, b, or c."

    # ── Direction Detection ──────────────────────────────────────────
    - id: direction_a_step3_4
      type: change_direction
      variable: a
      from_step: 3
      to_step: 4
      answer_type: category
      question: "From step {from_step} to step {to_step}, did a increase, decrease, or stay the same?"

    # ── Delta Estimation ─────────────────────────────────────────────
    - id: amount_a_step3_4
      type: change_amount
      variable: a
      from_step: 3
      to_step: 4
      answer_type: number
      question: "By how much did a change from step {from_step} to step {to_step}?"

# ── Visual rendering ───────────────────────────────────────────────────

visual:
  playwright:
    headless: true
    slow_mo: 0

  bar_standalone:
    template_path: templates/benchmarks/bar_standalone.html
    width: 900
    height: 500

  slider:
    template_path: templates/benchmarks/slider_view.html
    width: 900
    height: 500

  dot:
    template_path: templates/benchmarks/dot_plot_view.html
    width: 900
    height: 500

  grid:
    template_path: templates/benchmarks/grid_view.html
    width: 900
    height: 500

  history_chart:
    template_path: templates/benchmarks/history_chart.html
    width: 900
    height: 520

  bar:
    template_path: templates/chart_state_view.html
    normalize_bars: true
    exclude_variables: []

  line:
    template_path: templates/benchmarks/step_plot.html
    width: 900
    height: 520
    normalize_y: true

  scatter:
    template_path: templates/benchmarks/step_plot.html
    width: 900
    height: 520
    normalize_y: true

# ── Scoring ────────────────────────────────────────────────────────────

scoring:
  tolerance: 0.0

# ── Agent ──────────────────────────────────────────────────────────────

agent:
  backend: hf_qwen_vl
  model_name: Qwen/Qwen2.5-VL-72B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
  generation:
    max_new_tokens: 64
    temperature: 0.0
    do_sample: false

# ── Output ─────────────────────────────────────────────────────────────

logging:
  output_dir: outputs/chart_sanity_72b
