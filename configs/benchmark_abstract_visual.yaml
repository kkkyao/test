benchmark:
  name: abstract_visual_encoding_poc
  seed: 42
  n_sequences: 10
  sequence_length: 5   # steps 0 – 4
  round_digits: 0

  # No dependent variable in Phase 1.
  # Only input variables a, b, c are rendered and queried.
  variables:
    input_variables:
      - a
      - b
      - c

    specs:
      a:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0
      b:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0
      c:
        min_value: 1
        max_value: 10
        step: 1
        decimals: 0

  # 6 visualizations × 2 conditions = 12 modalities
  # Family A (current-state): bar, slider, dot, grid
  # Family B (history-aware): line, scatter
  modalities:
    - bar_ocr
    - bar_nocr
    - slider_ocr
    - slider_nocr
    - dot_ocr
    - dot_nocr
    - grid_ocr
    - grid_nocr
    - line_ocr
    - line_nocr
    - scatter_ocr
    - scatter_nocr

  # ── Task definitions ────────────────────────────────────────────────
  #
  # Open-ended tasks produce one case per (sequence, task, modality).
  # Tasks with generate_paired: true also produce two assertion cases
  # (positive + negative) sharing a pair_id, for Acc++ evaluation.
  #
  # Tasks NOT covered here (can be added later):
  #   change_amount for b / c
  #   value_at_step for earlier steps
  #   argmax at earlier steps

  tasks:

    # ── Value Extraction ─────────────────────────────────────────────

    - id: read_a_last
      type: value_at_step
      variable: a
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of a?"
      generate_paired: true

    - id: read_b_last
      type: value_at_step
      variable: b
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of b?"
      generate_paired: true

    - id: read_c_last
      type: value_at_step
      variable: c
      step: last
      answer_type: number
      question: "At the current step (step {step}), what is the value of c?"
      generate_paired: true

    # Read a value at an earlier step (tests history reading for line/scatter).
    - id: read_a_step1
      type: value_at_step
      variable: a
      step: 1
      answer_type: number
      question: "At step 1, what is the value of a?"
      generate_paired: true

    # ── Value Comparison ─────────────────────────────────────────────

    - id: argmax_last
      type: argmax_at_step
      step: last
      answer_type: category
      question: "At the current step (step {step}), which variable — a, b, or c — has the largest value?"
      generate_paired: true

    - id: compare_ab_last
      type: comparison_at_step
      variable_a: a
      variable_b: b
      step: last
      answer_type: category
      question: "At the current step (step {step}), is a larger than b? Answer yes or no."
      generate_paired: true

    - id: compare_ac_last
      type: comparison_at_step
      variable_a: a
      variable_b: c
      step: last
      answer_type: category
      question: "At the current step (step {step}), is a larger than c? Answer yes or no."
      generate_paired: true

    # ── Two-Step Comparison ──────────────────────────────────────────

    # Which variable changed between step 3 and step 4?
    - id: changed_step3_4
      type: changed_variable
      from_step: 3
      to_step: 4
      answer_type: category
      question: "Which variable changed from step {from_step} to step {to_step}? Answer with exactly one of: a, b, or c."
      generate_paired: true

    # Direction of change for a between step 3 and step 4.
    - id: direction_a_step3_4
      type: change_direction
      variable: a
      from_step: 3
      to_step: 4
      answer_type: category
      question: "From step {from_step} to step {to_step}, did a increase, decrease, or stay the same?"
      generate_paired: true

    # Magnitude of change for a between step 3 and step 4.
    # No paired assertion for change_amount (open-ended number only).
    - id: amount_a_step3_4
      type: change_amount
      variable: a
      from_step: 3
      to_step: 4
      answer_type: number
      question: "By how much did a change from step {from_step} to step {to_step}?"

# ── Visual rendering configuration ───────────────────────────────────

visual:
  playwright:
    headless: true
    slow_mo: 0

  # Standalone bar chart (no output panel, shared scale 1–10).
  bar_standalone:
    template_path: templates/benchmarks/bar_standalone.html
    width: 900
    height: 500

  slider:
    template_path: templates/benchmarks/slider_view.html
    width: 900
    height: 500

  dot:
    template_path: templates/benchmarks/dot_plot_view.html
    width: 900
    height: 500

  grid:
    template_path: templates/benchmarks/grid_view.html
    width: 900
    height: 500

  history_chart:
    template_path: templates/benchmarks/history_chart.html
    width: 900
    height: 520

  # Legacy modalities (not used by this benchmark but kept for schema
  # compatibility with the existing beers_wavelength benchmark).
  bar:
    template_path: templates/chart_state_view.html
    normalize_bars: true
    exclude_variables: []

  line:
    template_path: templates/benchmarks/step_plot.html
    width: 900
    height: 520
    normalize_y: true

  scatter:
    template_path: templates/benchmarks/step_plot.html
    width: 900
    height: 520
    normalize_y: true

# ── Scoring ──────────────────────────────────────────────────────────

scoring:
  # Exact match for number tasks (integer values only in this benchmark).
  tolerance: 0.0

# ── Agent ────────────────────────────────────────────────────────────

agent:
  # Use mock_benchmark to run oracle accuracy check first.
  backend: mock_benchmark

  # For real VLM evaluation, override with:
  # backend: hf_qwen_vl
  # model_name: Qwen/Qwen2.5-VL-7B-Instruct
  # dtype: bfloat16
  # device_map: auto
  # trust_remote_code: true

  generation:
    max_new_tokens: 64
    temperature: 0.0
    do_sample: false

# ── Output ───────────────────────────────────────────────────────────

logging:
  output_dir: outputs/visual_benchmark
