environment:
  target_variable: total_resistance

  variables:
    resistance_1:
      manipulable: true
      initial_value: 10
      step_size: 5
      min_value: 5
      max_value: 50
      description: resistance of the first resistor in ohms

    resistance_2:
      manipulable: true
      initial_value: 5
      step_size: 5
      min_value: 5
      max_value: 50
      description: resistance of the second resistor in ohms

    total_resistance:
      manipulable: false
      description: total resistance of the circuit in ohms

  equations:
    total_resistance: "resistance_1 + resistance_2"

representation:
  naming_mode: abstract
  metadata_level: none
  name_mapping:
    resistance_1: A
    resistance_2: B
    total_resistance: Y

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    A: resistance_1
    B: resistance_2
    Y: total_resistance
  equation_variables:
    - A
    - B

noise:
  enabled: false
  type: null
  params: {}

display:
  output_bar_range: [0, 200]
