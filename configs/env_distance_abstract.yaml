environment:
  target_variable: total_distance

  variables:
    distance_1:
      manipulable: true
      initial_value: 10
      step_size: 5
      min_value: 5
      max_value: 50
      description: first segment distance in metres

    distance_2:
      manipulable: true
      initial_value: 20
      step_size: 5
      min_value: 5
      max_value: 50
      description: second segment distance in metres

    distance_3:
      manipulable: true
      initial_value: 30
      step_size: 5
      min_value: 5
      max_value: 50
      description: third segment distance in metres

    total_distance:
      manipulable: false
      description: total distance in metres

  equations:
    total_distance: "distance_1 + distance_2 + distance_3"

representation:
  naming_mode: abstract
  metadata_level: none
  name_mapping:
    distance_1: A
    distance_2: B
    distance_3: C
    total_distance: Y

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    A: distance_1
    B: distance_2
    C: distance_3
    Y: total_distance
  equation_variables:
    - A
    - B
    - C

noise:
  enabled: false
  type: null
  params: {}

display:
  output_bar_range: [0, 200]
