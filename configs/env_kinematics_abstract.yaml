environment:
  target_variable: position

  variables:
    initial_position:
      manipulable: true
      initial_value: 0
      step_size: 5
      min_value: 0
      max_value: 45
      description: initial position of the object in metres

    velocity:
      manipulable: true
      initial_value: 5
      step_size: 1
      min_value: 1
      max_value: 10
      description: constant velocity of the object in metres per second

    time:
      manipulable: true
      initial_value: 2
      step_size: 1
      min_value: 1
      max_value: 10
      description: elapsed time in seconds

    position:
      manipulable: false
      description: current position of the object in metres

  equations:
    position: "initial_position + velocity * time"

representation:
  naming_mode: abstract
  metadata_level: none
  name_mapping:
    initial_position: A
    velocity: B
    time: C
    position: Y

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    A: initial_position
    B: velocity
    C: time
    Y: position
  equation_variables:
    - A
    - B
    - C

noise:
  enabled: false
  type: null
  params: {}