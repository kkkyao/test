environment:
  target_variable: mass

  variables:
    density:
      manipulable: true
      initial_value: 2
      step_size: 1
      min_value: 1
      max_value: 10
      description: density of the material in kg per cubic metre

    volume:
      manipulable: true
      initial_value: 10
      step_size: 5
      min_value: 5
      max_value: 50
      description: volume of the object in cubic metres

    mass:
      manipulable: false
      description: total mass of the object in kilograms

  equations:
    mass: "density * volume"

representation:
  naming_mode: abstract
  metadata_level: none
  name_mapping:
    density: A
    volume: B
    mass: Y

actions:
  action_mode: increase_decrease

evaluation:
  variable_mapping:
    A: density
    B: volume
    Y: mass
  equation_variables:
    - A
    - B

noise:
  enabled: false
  type: null
  params: {}

display:
  output_bar_range: [0, 600]
